;==============================================================
; extensions.conf — Asterisk dialplan
;==============================================================

[general]
static=yes
writeprotect=no
autofallthrough=yes

;──────────────────────────────────────────────────────────────
; [from-booking-app]
; Handles calls originated by the backend AMI (trigger-call).
; Per spec:
;   1. Answer the incoming channel
;   2. Log the target number to the Asterisk log
;   3. Play the demo-congrats sound
;   4. Hang up
;──────────────────────────────────────────────────────────────
[from-booking-app]

; Outbound calls to any E.164 / national number via Yeastar trunk
exten => _X.,1,NoOp(EV Booking — outbound call to ${EXTEN})
 same => n,Answer()
 same => n,Log(NOTICE, EV Booking call triggered — target: ${EXTEN} SIM caller: ${CALLERID(num)})
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; Fallthrough on no-answer or busy
exten => _X.,n+1,Hangup()

;──────────────────────────────────────────────────────────────
; [from-yeastar]
; Handles inbound legs arriving from the Yeastar gateway.
;──────────────────────────────────────────────────────────────
[from-yeastar]

exten => s,1,NoOp(Inbound from Yeastar — ${CALLERID(num)})
 same => n,Answer()
 same => n,Log(NOTICE, Inbound call from ${CALLERID(num)} via Yeastar TG1600)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

exten => _X.,1,NoOp(Inbound DID ${EXTEN} from Yeastar)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
