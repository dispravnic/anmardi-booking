;==============================================================
; manager.conf — Asterisk Manager Interface (AMI)
; Allows the backend to originate calls via TCP on port 5038
;==============================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; Allow connections from anywhere inside the Docker network
allowmultiplelogins = yes

[admin]
secret = secret
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = all
write = all
writetimeout = 5000
