;==============================================================
; pjsip.conf — Asterisk PJSIP configuration
; - UDP transport on 5060
; - Endpoint "100" (softphone / booking-app SIP client, pw: 1234)
; - Trunk "yeastar-gateway" pointing at Yeastar TG1600
;==============================================================

; ── Transport ──────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ══════════════════════════════════════════════════════════════
; Endpoint 100 — booking-app / softphone extension
; password: 1234
; ══════════════════════════════════════════════════════════════
[100]
type=endpoint
transport=transport-udp
context=from-booking-app
disallow=all
allow=ulaw
allow=alaw
auth=auth100
aors=aor100
direct_media=no
force_rport=yes
rewrite_contact=yes

[auth100]
type=auth
auth_type=userpass
username=100
password=1234

[aor100]
type=aor
max_contacts=5
remove_existing=yes

; ══════════════════════════════════════════════════════════════
; Trunk — yeastar-gateway (Yeastar TG1600 GSM Gateway)
; Resolves to mock-yeastar:5060 inside Docker (telecom-net)
; Override host via YEASTAR_GATEWAY_URL for physical hardware
; ══════════════════════════════════════════════════════════════
[yeastar-gateway]
type=endpoint
transport=transport-udp
context=from-yeastar
disallow=all
allow=ulaw
allow=alaw
outbound_auth=yeastar-auth
aors=yeastar-aor
direct_media=no
force_rport=yes
rewrite_contact=yes

[yeastar-auth]
type=auth
auth_type=userpass
username=asterisk
password=asterisk123

[yeastar-aor]
type=aor
; Docker service name resolves on telecom-net bridge
contact=sip:mock-yeastar:5060
qualify_frequency=30

[yeastar-identify]
type=identify
endpoint=yeastar-gateway
match=mock-yeastar
