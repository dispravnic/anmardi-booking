server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Proxy /api/* → Fastify backend ───────────────────────────────────────
    # In Docker Compose: "backend" resolves via internal DNS
    # In Render/cloud:   BACKEND_URL env var is set to the live service URL
    set $backend_url "${BACKEND_URL}";
    location /api/ {
        proxy_pass         $backend_url/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Angular SPA — serve index.html for all unknown routes ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache hashed JS/CSS bundles aggressively ──────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Serve sourcemaps only in dev (remove in prod hardening) ──────────────
    location ~* \.map$ {
        access_log off;
        return 404;
    }
}
