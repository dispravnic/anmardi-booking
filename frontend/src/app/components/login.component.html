<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Sign In</h1>
    <p class="auth-subtitle">Welcome back to AnMardi EV Booking</p>

    <form (ngSubmit)="submit()" #loginForm="ngForm" novalidate>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email"
          [(ngModel)]="form.email" name="email"
          required placeholder="you&#64;example.com"
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
          [(ngModel)]="form.password" name="password"
          required minlength="6" placeholder="Your password"
          autocomplete="current-password" />
      </div>

      @if (errorMsg()) {
        <div class="feedback feedback--error" role="alert">{{ errorMsg() }}</div>
      }

      <button type="submit" class="btn btn-primary"
        [disabled]="submitting() || !loginForm.valid">
        {{ submitting() ? 'Signing in…' : 'Sign In' }}
      </button>

    </form>

    <p class="auth-link">
      Don't have an account?
      <a (click)="goToRegister()" tabindex="0" role="link">Register</a>
    </p>
  </div>
</div>
