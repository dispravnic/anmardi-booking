<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join AnMardi EV Booking</p>

    <form (ngSubmit)="submit()" #regForm="ngForm" novalidate>

      <!-- ── Role Toggle ──────────────────────────────────────── -->
      <div class="role-toggle">
        <button type="button"
          class="toggle-btn"
          [class.active]="form.role === 'client'"
          (click)="form.role = 'client'"
          aria-label="Register as client">
          👤 Client
        </button>
        <button type="button"
          class="toggle-btn"
          [class.active]="form.role === 'provider'"
          (click)="form.role = 'provider'"
          aria-label="Register as provider">
          🏢 Provider
        </button>
      </div>

      <!-- ── Common fields ────────────────────────────────────── -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text"
            [(ngModel)]="form.firstName" name="firstName"
            required minlength="1" placeholder="Ion" />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text"
            [(ngModel)]="form.lastName" name="lastName"
            required minlength="1" placeholder="Popescu" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email"
          [(ngModel)]="form.email" name="email"
          required placeholder="you&#64;example.com" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password"
            [(ngModel)]="form.password" name="password"
            required minlength="6" placeholder="Min 6 chars" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm</label>
          <input id="confirmPassword" type="password"
            [(ngModel)]="form.confirmPassword" name="confirmPassword"
            required placeholder="Repeat" />
        </div>
      </div>

      <!-- ── Provider-only fields ─────────────────────────────── -->
      @if (isProvider) {
        <div class="provider-section">
          <h3 class="section-label">Business Details</h3>

          <div class="form-group">
            <label for="businessName">Business Name</label>
            <input id="businessName" type="text"
              [(ngModel)]="form.businessName" name="businessName"
              required placeholder="My Charging Station" />
          </div>

          <div class="form-group">
            <label for="businessType">Category</label>
            <select id="businessType"
              [(ngModel)]="form.businessType" name="businessType"
              required>
              <option value="" disabled>Select category…</option>
              @for (bt of businessTypes; track bt.value) {
                <option [value]="bt.value">{{ bt.label }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="phoneNumber">Mobile Phone (SMS)</label>
            <input id="phoneNumber" type="tel"
              [(ngModel)]="form.phoneNumber" name="phoneNumber"
              required placeholder="+40745031738" />
          </div>

          <div class="form-group">
            <label for="businessEmail">Business Email (optional)</label>
            <input id="businessEmail" type="email"
              [(ngModel)]="form.businessEmail" name="businessEmail"
              placeholder="contact&#64;mybusiness.com" />
          </div>
        </div>
      }

      <!-- ── Client phone (optional) ─────────────────────────── -->
      @if (!isProvider) {
        <div class="form-group">
          <label for="clientPhone">Phone (optional, for SMS alerts)</label>
          <input id="clientPhone" type="tel"
            [(ngModel)]="form.phoneNumber" name="phoneNumber"
            placeholder="+40712345678" />
        </div>
      }

      <!-- ── Feedback ─────────────────────────────────────────── -->
      @if (errorMsg()) {
        <div class="feedback feedback--error" role="alert">{{ errorMsg() }}</div>
      }
      @if (successMsg()) {
        <div class="feedback feedback--success" role="status">{{ successMsg() }}</div>
      }

      <!-- ── Submit ───────────────────────────────────────────── -->
      <button type="submit" class="btn btn-primary"
        [disabled]="submitting() || !regForm.valid">
        {{ submitting() ? 'Creating account…' : 'Register' }}
      </button>

    </form>

    <p class="auth-link">
      Already have an account?
      <a (click)="goToLogin()" tabindex="0" role="link">Sign in</a>
    </p>
  </div>
</div>
